name: image

# Tests the bridge, then builds it with its pinned agy (Dockerfile) and pushes it
# to GHCR as ghcr.io/<owner>/kodizm-ai-agy-docker. Kodizm pulls it on its Docker
# host; nothing here deploys. The package must be public so the host pulls it
# without registry credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # --init gives the container a PID 1 that reaps orphans. Without it the
    # processes the tests spawn stay zombies and the tests that wait for them to
    # exit time out; the image itself runs under tini for the same reason.
    container:
      image: golang:1.25.6-bookworm
      options: --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # -timeout is shorter than the job limit so a hung test fails with a
      # goroutine dump naming it, instead of the job being cancelled blind.
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -timeout 8m ./...

  image:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Name the image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/kodizm-ai-agy-docker" >> "$GITHUB_ENV"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
